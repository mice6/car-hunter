# Skopiuj do config.yaml i dostosuj.

# Zmiany w tym pliku działają od następnego cyklu (co 30 min), bez restartu kontenera.
# Wymagania (twarde): auto niespełniające ich nie dostaje alertu i nie idzie na RunPod.
# Pusta lista [] = bez ograniczenia.
criteria:
  min_power_hp: 170
  gearbox: automatic            # automatic | manual | null (dowolna)
  budget_total_pln: 55000       # zakup + naprawa + opłaty
  max_purchase_pln: 50000       # górna cena ogłoszenia (filtr już przy pobieraniu)
  min_year: 2010
  max_year: null
  max_mileage_km: null          # np. 250000
  fuels: []                     # diesel | petrol | petrol-lpg | hybrid | plugin-hybrid | electric
  bodies: []                    # suv | combi | sedan | compact | minivan | coupe | cabrio | city-car
  include_makes: []             # np. [kia, bmw, audi, volvo] - slugi jak w URL OtoMoto
  exclude_makes: []             # np. [chrysler, dodge]
  include_models: []            # np. [kia/stinger, bmw/seria-5, volvo/xc60]
  exclude_models: []            # np. [bmw/x6]
  regions: []                   # województwa, np. [Dolnośląskie, Wielkopolskie, Lubuskie, Opolskie]
  exclude_rhd: true
  exclude_us_imports: false     # true = pomijaj importy z USA (Copart/IAAI)
  exclude_unregistered: false   # true = tylko auta zarejestrowane w PL
  min_photos: 3                 # mniej zdjęć = nie da się ocenić
  exclude_missing_powertrain: true   # "bez silnika", "brak skrzyni"
  min_price_ratio: 0.35         # cena < 35% wartości zdrowego = prawie zawsze wrak -> pomijaj
  # limity szkody (działają po ocenie zdjęć)
  max_damage: moderate          # light | moderate | heavy
  exclude_airbags: true
  exclude_structural: true
  exclude_not_drivable: false
  exclude_flood_fire: true

# Preferencje (miękkie): premia do score, nie wykluczają.
preferences:
  bodies: [suv, combi]
  fuels: [diesel]
  makes: []

scoring:
  asking_to_transaction: 0.93     # ceny ofertowe zdrowych aut są zawyżone ~7%
  damage_history_discount: 0.0    # auto dla siebie -> 0; przy odsprzedaży ~0.12
  pref_bonus_pln: 3000            # premia za nadwozie/markę z preferencji (paliwo: połowa)
  fees:
    pcc_rate: 0.02
    registration_inspection_pln: 1000
    transport_pln: 800
    unregistered_import_pln: 1500  # tłumaczenia, badanie, rejestracja auta sprowadzonego
  min_score_alert_pln: 8000        # alert, gdy skorygowana oszczędność >= tej kwoty
  min_comparables: 5
  valuation_year_window: 2         # wycena tylko z aut ±2 roczniki
  implied_damage_share: 0.5        # bez zdjęć: 50% różnicy cena-rynek traktuj jako szkodę
  vision_min_gap_share: 0.25       # ze zdjęciami: naprawa nie mniej niż 25% różnicy cena-rynek

scraper:
  delay_min_s: 2.5
  delay_max_s: 6.0
  candidate_max_pages: 120         # przy pełnym przebiegu
  incremental_known_pages_stop: 2  # tryb przyrostowy: stop po N stronach samych znanych ogłoszeń
  market_max_pages_per_model: 15
  market_refresh_hours: 72
  market_year_span: 2              # rocznik kandydata ±2
  market_min_power_hp: 120         # zdrowe auta do wyceny (szerzej niż kryterium, lepszy model)
  eur_pln: 4.25
  sources: [otomoto, olx]

vision:                          # ocena zdjęć na RunPod (wymaga RUNPOD_API_KEY i RUNPOD_ENDPOINT_ID w .env)
  auto: false                    # false = tylko ręcznie: hunter vision --id N / --limit N
  every_hours: 3                 # w trybie auto: jeden pakiet co N godzin (każdy pakiet = 1 zimny start)
  model: qwen/qwen3-vl-30b-a3b-instruct-fp8   # dokładnie jak w GET /openai/v1/models endpointu
  max_images: 12
  image_size: 1024x768
  inline_images: true            # zdjęcia pobiera car-hunter i wysyła jako base64
  min_photos: 4
  concurrency: 4                 # równoległe zapytania (vLLM batchuje je na jednym GPU)
  timeout_s: 600                 # zimny start endpointu potrafi trwać 1-3 min
  max_per_run: 25                # aut w jednym pakiecie
  max_per_day: 150               # twardy limit kosztów (~$1-1.5/dzień przy 30B na 48 GB)
  min_optimistic_savings_pln: 4000   # wysyłaj tylko auta z szansą na oszczędność
  require_for_alert: true        # alertuj tylko auta ocenione ze zdjęć

schedule:
  candidates_every_min: 30
  full_sweep_every_hours: 24
  market_every_hours: 24

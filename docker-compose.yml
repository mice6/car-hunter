services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hunter}
      POSTGRES_DB: hunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # dostęp z hosta (DBeaver/Metabase), tylko lokalnie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter"]
      interval: 10s
      retries: 5

  hunter:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hunter:${POSTGRES_PASSWORD:-hunter}@db:5432/hunter
      HUNTER_CONFIG: /data/config.yaml
    volumes:
      - ./:/data:ro         # katalog, nie plik: zmiany z panelu widoczne bez restartu
    command: ["run"]

  panel:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hunter:${POSTGRES_PASSWORD:-hunter}@db:5432/hunter
      HUNTER_CONFIG: /data/config.yaml
    volumes:
      - ./:/data            # katalog (nie sam plik): atomowy zapis config.yaml + config-backups/
    ports:
      - "${PANEL_PORT:-8080}:8080"
    command: ["panel"]

volumes:
  pgdata:
